name: mobile-package
on:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Decode the shell signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mcw-shell.jks"
      # Android functional/device verification is explicitly excluded by the user.
      # Build/signing integrity is required to distribute the latest compatible APK.
      - name: Build signed APK without Android verification
        working-directory: android
        env:
          MCW_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mcw-shell.jks
          MCW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MCW_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MCW_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Require the existing update signing identity
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -qi 'f313f9a57702bff47c5e2b6fa10b032e3f434513004ca14ca8834457ffb844e9'
      - run: node scripts/prepare-mobile-shell.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-shell
          path: build/mobile/
      - uses: actions/upload-artifact@v7
        with:
          name: release-mobile
          path: release/Multi-CLI-Work-Mobile-*.apk
