name: v2-preview
on:
  workflow_dispatch:
  push:
    branches: [codex/herdr-v2]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm python3 xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libnotify4 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 libfuse2 policykit-1 openssh-server && sudo mkdir -p /run/sshd
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Acquire digest-pinned resources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/v2/assets.mjs --download --platform $(node -p 'process.platform')
      - run: npm run build:v2
      # Keep the real hook's 10s deadline; isolate cold PowerShell startup from
      # simultaneous jsdom/worker initialization on the small hosted runners.
      - name: Provider hooks in a dedicated worker
        run: npx vitest run src/main/providers/claude-integration.test.ts --maxWorkers=1
      - run: npm test -- --maxWorkers=2 --exclude src/main/providers/claude-integration.test.ts
      - name: Isolated OpenSSH host transport
        if: runner.os == 'Linux'
        env:
          MCW_SSH_TEST: '1'
        run: npx vitest run src/main/host/ssh-host-integration.test.ts --maxWorkers=1
      - run: cargo test --locked --manifest-path native/herdr-bridge/Cargo.toml
      - name: Actual Herdr Windows broker tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MCW_HERDR_TEST_BINARY=(Resolve-Path build/v2/herdr/windows-mcw/herdr.exe).Path
          $env:MCW_BRIDGE_TEST_BINARY=(Resolve-Path build/herdr-bridge/win32-x64/mcw-herdr-bridge.exe).Path
          npx vitest run src/main/herdr --maxWorkers=2
      - name: Actual Herdr Linux broker tests
        if: runner.os == 'Linux'
        run: MCW_HERDR_TEST_BINARY="$PWD/build/v2/herdr/herdr-linux-x86_64" MCW_BRIDGE_TEST_BINARY="$PWD/build/herdr-bridge/linux-x64/mcw-herdr-bridge" npx vitest run src/main/herdr --maxWorkers=2
      - name: Windows GUI survival and reconnect
        if: runner.os == 'Windows'
        env:
          MCW_V2_E2E: '1'
        run: npx playwright test e2e/herdr-v2.spec.ts
      - name: Linux GUI survival and reconnect
        if: runner.os == 'Linux'
        env:
          MCW_V2_E2E: '1'
          DEBUG: pw:browser
        run: xvfb-run -a npx playwright test e2e/herdr-v2.spec.ts
      - run: npx electron-builder --config electron-builder.v2-preview.cjs --publish never
      - name: Verify packaged Windows modules and GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/v2/check-packaged-main.mjs release-v2-preview/win-unpacked/resources/app.asar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MCW_V2_E2E='1'
          $env:MCW_V2_E2E_EXECUTABLE=(Resolve-Path 'release-v2-preview/win-unpacked/Multi CLI Work Preview.exe').Path
          npx playwright test e2e/herdr-v2.spec.ts --output=test-results/packaged
      - name: Verify packaged Linux modules and GUI
        if: runner.os == 'Linux'
        run: |
          node scripts/v2/check-packaged-main.mjs release-v2-preview/linux-unpacked/resources/app.asar
          MCW_V2_E2E=1 MCW_V2_E2E_EXECUTABLE="$PWD/release-v2-preview/linux-unpacked/multi-cli-work" xvfb-run -a npx playwright test e2e/herdr-v2.spec.ts --output=test-results/packaged
      - run: node scripts/v2/release-gate.mjs --check-release preview --artifact-dir release-v2-preview
      - name: Build isolated original-identity upgrade candidate
        run: npx electron-builder --config electron-builder.v2-recovery.cjs --publish never
      - name: Original Windows installer offline roundtrip
        if: runner.os == 'Windows'
        env:
          MCW_RECOVERY_ROUNDTRIP: win32
        run: npx playwright test e2e/recovery-roundtrip.spec.ts --output=test-results/roundtrip-win32
      - name: Original deb and AppImage offline roundtrips
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node_binary="$(command -v node)"
          for flavor in deb appimage; do
            MCW_RECOVERY_ROUNDTRIP="$flavor" xvfb-run -a sudo -E unshare --net bash scripts/recovery/offline-linux.sh "$node_binary" node_modules/@playwright/test/cli.js test e2e/recovery-roundtrip.spec.ts --output="test-results/roundtrip-$flavor"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v2-preview-${{ runner.os }}
          path: |
            release-v2-preview/*.exe
            release-v2-preview/*.AppImage
            release-v2-preview/*.deb
            test-results/
  # Android verification was explicitly deferred by the user; release notes must disclose it.
