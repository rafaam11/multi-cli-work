name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Require tested v2 candidate and authorized Android deferral
        run: |
          node -e "if(require('./package.json').version!=='2.0.0')throw new Error('Stable v2 packaging requires version 2.0.0')"
          node scripts/v2/release-gate.mjs --check-release stable
      - name: Require tag and package version to match
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json v${package_version}" >&2
            exit 1
          }

  android:
    needs: verify-version
    uses: ./.github/workflows/mobile-package.yml
    secrets: inherit
    permissions:
      contents: read

  windows:
    needs: [verify-version, android]
    runs-on: windows-2022
    env:
      MCW_V2_E2E_SHELL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - uses: actions/download-artifact@v8
        with:
          name: mobile-shell
          path: build/mobile
      - name: Acquire digest-pinned resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/v2/assets.mjs --download --platform win32
      - run: npm run build:v2
      - run: npx vitest run src/main/providers/claude-integration.test.ts --maxWorkers=1
      - run: npm test -- --maxWorkers=2 --exclude src/main/providers/claude-integration.test.ts
      - run: cargo test --locked --manifest-path native/herdr-bridge/Cargo.toml
      - name: Source GUI and phone gateway
        env:
          MCW_V2_E2E: '1'
        run: npx playwright test e2e/herdr-v2.spec.ts
      - run: npx electron-builder --config electron-builder.v2.cjs --win --publish never
      - name: Verify actual stable package
        shell: pwsh
        run: |
          node scripts/v2/check-packaged-main.mjs release/win-unpacked/resources/app.asar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MCW_V2_E2E='1'
          $env:MCW_V2_E2E_EXECUTABLE=(Resolve-Path 'release/win-unpacked/Multi CLI Work.exe').Path
          npx playwright test e2e/herdr-v2.spec.ts --output=test-results/stable-packaged
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            release/Multi-CLI-Work-Setup-*.exe
            release/Multi-CLI-Work-Setup-*.exe.blockmap
            release/latest.yml

  linux:
    needs: [verify-version, android]
    runs-on: ubuntu-22.04
    env:
      MCW_V2_E2E_SHELL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm python3 xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libnotify4 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 libfuse2 policykit-1
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - uses: actions/download-artifact@v8
        with:
          name: mobile-shell
          path: build/mobile
      - name: Acquire digest-pinned resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/v2/assets.mjs --download --platform linux
      - run: npm run build:v2
      - run: npx vitest run src/main/providers/claude-integration.test.ts --maxWorkers=1
      - run: npm test -- --maxWorkers=2 --exclude src/main/providers/claude-integration.test.ts
      - run: cargo test --locked --manifest-path native/herdr-bridge/Cargo.toml
      - name: Source GUI and phone gateway
        env:
          MCW_V2_E2E: '1'
        run: xvfb-run -a npx playwright test e2e/herdr-v2.spec.ts
      - name: Package Linux assets
        run: npx electron-builder --config electron-builder.v2.cjs --linux deb AppImage --x64 --publish never
      - name: Verify actual stable package
        run: |
          node scripts/v2/check-packaged-main.mjs release/linux-unpacked/resources/app.asar
          MCW_V2_E2E=1 MCW_V2_E2E_EXECUTABLE="$PWD/release/linux-unpacked/multi-cli-work" xvfb-run -a npx playwright test e2e/herdr-v2.spec.ts --output=test-results/stable-packaged
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: |
            release/Multi-CLI-Work-*-linux-x64.deb
            release/Multi-CLI-Work-*-linux-x64.AppImage
            release/latest-linux.yml

  draft-release:
    if: github.ref_type == 'tag'
    needs: [android, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: docs/release/${{ github.ref_name }}.md
          files: release/*
