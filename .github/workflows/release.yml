name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Require tag and package version to match
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json v${package_version}" >&2
            exit 1
          }

  android:
    needs: verify-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Decode the shell signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mcw-shell.jks"
      - name: Test and build the signed shell
        working-directory: android
        env:
          MCW_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mcw-shell.jks
          MCW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MCW_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MCW_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Refuse an unsigned shell
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
      - run: node scripts/prepare-mobile-shell.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-shell
          path: build/mobile/
      - uses: actions/upload-artifact@v7
        with:
          name: release-mobile
          path: release/Multi-CLI-Work-Mobile-*.apk

  windows:
    needs: [verify-version, android]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: mobile-shell
          path: build/mobile
      - run: npm test
      - run: npm run test:e2e
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            release/Multi-CLI-Work-Setup-*.exe
            release/Multi-CLI-Work-Setup-*.exe.blockmap
            release/latest.yml

  linux:
    needs: [verify-version, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm python3 xvfb libgtk-3-0 libnss3 libasound2 libgbm1
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: mobile-shell
          path: build/mobile
      - name: Rebuild node-pty for the native Electron ABI
        run: npm run rebuild:native
      - run: npm test
      - run: xvfb-run -a npm run test:e2e
      - name: Package Linux assets
        run: npx electron-builder --linux deb AppImage --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: |
            release/Multi-CLI-Work-*-linux-x64.deb
            release/Multi-CLI-Work-*-linux-x64.AppImage
            release/latest-linux.yml

  draft-release:
    if: github.ref_type == 'tag'
    needs: [android, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release/*
