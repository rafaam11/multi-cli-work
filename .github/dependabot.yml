version: 2
updates:
  # The actions the two workflows call go stale quietly: a runtime deprecation shows up only as an
  # annotation on a run nobody reads until the release pipeline breaks. Let the bumps arrive as pull
  # requests instead, where the PR jobs (verify + windows-smoke) check them before they land.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
