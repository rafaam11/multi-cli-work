<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="세션 상태 7종, 패인 테두리 대기 표시, 알림, 트레이 메뉴, 업데이트 배지 (와이어프레임 목업)">
  <rect x="0.5" y="0.5" width="1039" height="419" rx="12" fill="#161918" stroke="#343b38"/>

  <!-- ══ 세션 상태 ══ -->
  <text x="24" y="34" font-size="10.5" font-weight="700" fill="#717b76" letter-spacing="0.8">세션 상태</text>

  <g font-size="10.5" font-weight="600">
    <rect x="24" y="44" width="88" height="24" rx="12" fill="#1b232b" stroke="#6ea8d8"/>
    <circle cx="38" cy="56" r="3.5" fill="#6ea8d8"/><text x="50" y="60" fill="#6ea8d8">시작 중</text>

    <rect x="122" y="44" width="88" height="24" rx="12" fill="#14241f" stroke="#4fb7a4"/>
    <circle cx="136" cy="56" r="3.5" fill="#4fb7a4"/><text x="148" y="60" fill="#4fb7a4">작업 중</text>

    <rect x="220" y="44" width="88" height="24" rx="12" fill="#241d2b" stroke="#aa8ccc"/>
    <circle cx="234" cy="56" r="3.5" fill="#aa8ccc"/><text x="246" y="60" fill="#aa8ccc">입력 대기</text>

    <rect x="318" y="44" width="88" height="24" rx="12" fill="#2b2416" stroke="#d8a24a"/>
    <circle cx="332" cy="56" r="3.5" fill="#d8a24a"/><text x="344" y="60" fill="#d8a24a">승인 대기</text>

    <rect x="416" y="44" width="88" height="24" rx="12" fill="#182619" stroke="#73b987"/>
    <circle cx="430" cy="56" r="3.5" fill="#73b987"/><text x="442" y="60" fill="#73b987">대기</text>

    <rect x="514" y="44" width="88" height="24" rx="12" fill="#202524" stroke="#46504c"/>
    <circle cx="528" cy="56" r="3.5" fill="#717b76"/><text x="540" y="60" fill="#717b76">종료됨</text>

    <rect x="612" y="44" width="88" height="24" rx="12" fill="#2b1a1a" stroke="#d46a6a"/>
    <circle cx="626" cy="56" r="3.5" fill="#d46a6a"/><text x="638" y="60" fill="#d46a6a">오류</text>
  </g>
  <text x="24" y="86" font-size="9.5" fill="#717b76">입력 대기·승인 대기는 상태 어댑터가 알려줄 때만 나온다 · signals 어댑터는 둘을 구분할 수 없어 대기에 머문다 — 빠져나올 길 없는 작업 중에 가두는 것보다 정직하다</text>

  <!-- ══ 패인 테두리 ══ -->
  <text x="24" y="122" font-size="10.5" font-weight="700" fill="#717b76" letter-spacing="0.8">패인 테두리 — 지금 무엇이 나를 기다리는가</text>

  <!-- 입력 대기 -->
  <rect x="24" y="134" width="212" height="96" rx="8" fill="#101312" stroke="#aa8ccc" stroke-width="2"/>
  <path d="M24 142a8 8 0 0 1 8-8h196a8 8 0 0 1 8 8v18H24z" fill="#1c201f"/>
  <line x1="24" y1="160" x2="236" y2="160" stroke="#343b38"/>
  <circle cx="38" cy="151" r="3.5" fill="#aa8ccc"/>
  <text x="49" y="155" font-size="10.5" fill="#e7ebe8">Claude Code 1</text>
  <g font-family="Consolas, Cascadia Code, monospace" font-size="9.5">
    <text x="36" y="182" fill="#e7ebe8">❯ 어느 브랜치에 적용할까요?</text>
    <rect x="36" y="192" width="6" height="11" fill="#4fb7a4" opacity="0.85"/>
  </g>
  <text x="24" y="248" font-size="10" fill="#aa8ccc">입력 대기 · 맥동</text>

  <!-- 승인 대기 -->
  <rect x="256" y="134" width="212" height="96" rx="8" fill="#101312" stroke="#d8a24a" stroke-width="2"/>
  <path d="M256 142a8 8 0 0 1 8-8h196a8 8 0 0 1 8 8v18H256z" fill="#1c201f"/>
  <line x1="256" y1="160" x2="468" y2="160" stroke="#343b38"/>
  <circle cx="270" cy="151" r="3.5" fill="#d8a24a"/>
  <text x="281" y="155" font-size="10.5" fill="#e7ebe8">Claude Code 2</text>
  <g font-family="Consolas, Cascadia Code, monospace" font-size="9.5">
    <text x="268" y="182" fill="#d8a24a">Edit  ring-buffer.ts</text>
    <text x="268" y="198" fill="#e7ebe8">이 편집을 적용할까요?</text>
    <text x="268" y="214" fill="#4fb7a4">❯ 1. Yes</text>
  </g>
  <text x="256" y="248" font-size="10" fill="#d8a24a">승인 대기 · 맥동</text>

  <!-- 오류 -->
  <rect x="488" y="134" width="212" height="96" rx="8" fill="#101312" stroke="#d46a6a" stroke-width="2"/>
  <path d="M488 142a8 8 0 0 1 8-8h196a8 8 0 0 1 8 8v18H488z" fill="#1c201f"/>
  <line x1="488" y1="160" x2="700" y2="160" stroke="#343b38"/>
  <circle cx="502" cy="151" r="3.5" fill="#d46a6a"/>
  <text x="513" y="155" font-size="10.5" fill="#e7ebe8">Codex 1</text>
  <g font-family="Consolas, Cascadia Code, monospace" font-size="9.5">
    <text x="500" y="182" fill="#d46a6a">프로세스가 코드 1로 끝났습니다</text>
    <text x="500" y="198" fill="#717b76">↺ 로 재개할 수 있습니다</text>
  </g>
  <text x="488" y="248" font-size="10" fill="#d46a6a">오류 · 정지 (끝난 상태라 움직이지 않는다)</text>

  <text x="24" y="270" font-size="9.5" fill="#717b76">작업 중·대기·종료됨은 테두리를 그리지 않는다 — 셋 다 그리면 모든 패인이 테두리가 된다 · 포커스 링은 teal이고 상태 위에 덮인다 · prefers-reduced-motion에서는 맥동이 꺼진다</text>

  <!-- ══ 업데이트 배지 ══ -->
  <text x="24" y="308" font-size="10.5" font-weight="700" fill="#717b76" letter-spacing="0.8">업데이트 배지 — 사이드바 맨 아래</text>

  <g>
    <rect x="24" y="318" width="288" height="26" rx="6" fill="#1c201f" stroke="#343b38"/>
    <g fill="none" stroke="#9aa49f" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M43 332a5 5 0 1 1-1.6-3.7M43.4 323.4v3.1h-3.1"/>
    </g>
    <text x="56" y="335" font-size="10" font-family="Consolas, monospace" fill="#9aa49f">v1.20.1</text>
    <text x="106" y="335" font-size="10" fill="#717b76">최신 버전</text>
    <rect x="256" y="323" width="44" height="17" rx="4" fill="#252b29" stroke="#46504c"/>
    <text x="278" y="335.5" font-size="9.5" fill="#e7ebe8" text-anchor="middle">확인</text>

    <rect x="24" y="350" width="288" height="26" rx="6" fill="#1c201f" stroke="#343b38"/>
    <g fill="none" stroke="#4fb7a4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M43 364a5 5 0 1 1-1.6-3.7M43.4 355.4v3.1h-3.1"/>
    </g>
    <text x="56" y="367" font-size="10" font-family="Consolas, monospace" fill="#9aa49f">v1.20.1</text>
    <text x="106" y="367" font-size="10" fill="#4fb7a4">다운로드 중 62%</text>
    <rect x="256" y="355" width="44" height="17" rx="4" fill="#202524" stroke="#343b38"/>
    <text x="278" y="367.5" font-size="9.5" fill="#717b76" text-anchor="middle">확인</text>

    <rect x="24" y="382" width="288" height="26" rx="6" fill="#1c201f" stroke="#46504c"/>
    <g fill="none" stroke="#9aa49f" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M43 396a5 5 0 1 1-1.6-3.7M43.4 387.4v3.1h-3.1"/>
    </g>
    <text x="56" y="399" font-size="10" font-family="Consolas, monospace" fill="#9aa49f">v1.20.1</text>
    <text x="106" y="399" font-size="10" fill="#d8a24a">1.21.0 업데이트 설치 준비 완료</text>
    <rect x="256" y="387" width="44" height="17" rx="4" fill="#2b2416" stroke="#d8a24a"/>
    <text x="278" y="399.5" font-size="9.5" fill="#d8a24a" text-anchor="middle">재시작</text>
  </g>

  <text x="330" y="335" font-size="9.5" fill="#717b76">시작할 때 한 번 조용히 확인하고</text>
  <text x="330" y="351" font-size="9.5" fill="#717b76">있으면 알아서 내려받는다.</text>
  <text x="330" y="375" font-size="9.5" fill="#717b76">재시작을 누르지 않아도 다음</text>
  <text x="330" y="391" font-size="9.5" fill="#717b76">종료 때 설치된다.</text>

  <!-- ══ 알림 ══ -->
  <text x="724" y="122" font-size="10.5" font-weight="700" fill="#717b76" letter-spacing="0.8">알림</text>
  <rect x="724" y="134" width="292" height="96" rx="8" fill="#202524" stroke="#46504c"/>
  <rect x="724" y="134" width="4" height="96" rx="2" fill="#d8a24a"/>
  <g transform="translate(744,152) scale(0.66)">
    <rect x="1" y="1" width="22" height="22" rx="6" fill="#252b29"/>
    <g fill="none" stroke="#4fb7a4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6.8,7 12.2,12.2 6.8,17.4"/><line x1="13.6" y1="17.4" x2="18.4" y2="17.4"/>
    </g>
  </g>
  <text x="776" y="160" font-size="11" font-weight="600" fill="#e7ebe8">Claude Code 3 · dashboard</text>
  <text x="776" y="179" font-size="10.5" fill="#d8a24a">승인 대기</text>
  <text x="744" y="208" font-size="9.5" fill="#717b76">그리드에 없는 세션만 알린다 ·</text>
  <text x="744" y="222" font-size="9.5" fill="#717b76">클릭하면 창이 뜨고 그 세션으로 간다</text>

  <!-- ══ 트레이 ══ -->
  <text x="724" y="308" font-size="10.5" font-weight="700" fill="#717b76" letter-spacing="0.8">트레이 — 닫아도 세션은 계속 돈다</text>
  <rect x="724" y="318" width="292" height="90" rx="8" fill="#202524" stroke="#46504c"/>
  <g transform="translate(738,330) scale(0.6)">
    <rect x="1" y="1" width="22" height="22" rx="6" fill="#252b29"/>
    <g fill="none" stroke="#4fb7a4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6.8,7 12.2,12.2 6.8,17.4"/><line x1="13.6" y1="17.4" x2="18.4" y2="17.4"/>
    </g>
  </g>
  <text x="760" y="340" font-size="9.5" fill="#717b76">멀티 터미널 작업기 — 응답 대기 2개</text>
  <line x1="724" y1="348" x2="1016" y2="348" stroke="#343b38"/>
  <text x="744" y="364" font-size="11" fill="#e7ebe8">멀티 터미널 작업기 표시</text>
  <text x="744" y="382" font-size="11" fill="#e7ebe8">업데이트 확인</text>
  <line x1="736" y1="390" x2="1004" y2="390" stroke="#343b38"/>
  <text x="744" y="403" font-size="11" fill="#e7ebe8">종료</text>
</svg>
